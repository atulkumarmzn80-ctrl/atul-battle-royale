
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Royale</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#14251b;color:white;font-family:Arial;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
#info{position:fixed;top:12px;left:12px;background:#0009;padding:12px;border-radius:10px}
.controls{position:fixed;bottom:22px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end}
button{border:2px solid #fff8;background:#ffffff24;color:white;border-radius:50%;font-weight:bold;width:76px;height:76px;touch-action:none}
#shoot{background:#c0392b;font-size:16px}
#pad{display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px;gap:3px}
#pad button{width:50px;height:50px;border-radius:12px}
#pad span{display:block}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="info">BATTLE ROYALE<br>❤️ Health: <span id="hp">100</span><br>🎯 Score: <span id="score">0</span></div>
<div class="controls">
<div id="pad">
<span></span><button data-m="up">▲</button><span></span>
<button data-m="left">◀</button><button data-m="down">▼</button><button data-m="right">▶</button>
</div>
<button id="shoot">FIRE</button>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let w,h,px=0,py=0,hp=100,score=0,shots=[],enemies=[],keys={},last=0;
function resize(){c.width=w=innerWidth;c.height=h=innerHeight;px=w/2;py=h/2}
resize();addEventListener('resize',resize);
function spawn(){enemies.push({x:Math.random()*w,y:Math.random()*h,r:15})}
for(let i=0;i<5;i++)spawn();
document.querySelectorAll('[data-m]').forEach(b=>{
const k=b.dataset.m;
b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>keys[k]=false));
});
function fire(){shots.push({x:px,y:py-12,dy:-7})}
document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();fire()});
function loop(t){
let dt=Math.min((t-last)/16||1,2);last=t;
if(keys.up)py-=3*dt;if(keys.down)py+=3*dt;
if(keys.left)px-=3*dt;if(keys.right)px+=3*dt;
px=Math.max(15,Math.min(w-15,px));py=Math.max(15,Math.min(h-15,py));
ctx.fillStyle='#315b38';ctx.fillRect(0,0,w,h);
ctx.strokeStyle='#426b47';for(let x=0;x<w;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
ctx.fillStyle='#4bb6ff';ctx.beginPath();ctx.arc(px,py,15,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';ctx.fillRect(px-5,py-23,10,14);
shots.forEach(s=>s.y+=s.dy*dt);
shots=shots.filter(s=>s.y>-10);
ctx.fillStyle='#ffdf66';shots.forEach(s=>ctx.fillRect(s.x-3,s.y-8,6,12));
enemies.forEach(e=>{
let dx=px-e.x,dy=py-e.y,d=Math.hypot(dx,dy)||1;
e.x+=dx/d*.45*dt;e.y+=dy/d*.45*dt;
ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
if(d<25&&t%25<1)hp=Math.max(0,hp-1);
});
for(let i=enemies.length-1;i>=0;i--){
let e=enemies[i],hit=shots.some(s=>Math.hypot(s.x-e.x,s.y-e.y)<e.r+5);
if(hit){enemies.splice(i,1);shots=shots.filter(s=>Math.hypot(s.x-e.x,s.y-e.y)>=e.r+5);score++;spawn()}
}
document.getElementById('hp').textContent=hp;
document.getElementById('score').textContent=score;
if(hp>0)requestAnimationFrame(loop);
else{ctx.fillStyle='white';ctx.font='32px Arial';ctx.fillText('GAME OVER',w/2-95,h/2)}
}
requestAnimationFrame(loop);
</script>

<script>
(function () {
  const panel = document.createElement('div');
  panel.style.cssText =
    'position:fixed;top:12px;right:10px;z-index:10;' +
    'background:#10251fee;padding:12px;border-radius:12px;' +
    'width:190px;color:white;font:14px Arial';

  panel.innerHTML = `
    <b>🌐 ONLINE MULTIPLAYER</b>
    <input id="mpName" placeholder="अपना नाम"
      maxlength="16" value="Player"
      style="width:100%;padding:9px;margin-top:10px;box-sizing:border-box">
    <button id="mpCreate"
      style="width:100%;height:40px;border-radius:8px;margin-top:8px">
      Create Room
    </button>
    <input id="mpCode" placeholder="Room Code"
      maxlength="5"
      style="width:100%;padding:9px;margin-top:8px;box-sizing:border-box">
    <button id="mpJoin"
      style="width:100%;height:40px;border-radius:8px;margin-top:8px">
      Join Room
    </button>
    <div id="mpStatus" style="margin-top:10px;overflow-wrap:anywhere">
      सर्वर से जुड़ने के लिए तैयार
    </div>
  `;

  document.body.appendChild(panel);

  const overlay = document.createElement('canvas');
  overlay.style.cssText =
    'position:fixed;inset:0;width:100%;height:100%;' +
    'z-index:1;pointer-events:none';
  overlay.width = innerWidth;
  overlay.height = innerHeight;
  document.body.appendChild(overlay);

  const ctx = overlay.getContext('2d');
  const status = document.getElementById('mpStatus');
  const name = document.getElementById('mpName');
  let ws = null;
  let myId = null;
  let players = {};

  document.querySelector('#info').style.zIndex = 3;
  document.querySelector('.controls').style.zIndex = 3;

  function connect(action) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      sendAction(action);
      return;
    }

    status.textContent = 'सर्वर से जुड़ रहे हैं...';
    ws = new WebSocket(
      (location.protocol === 'https:' ? 'wss://' : 'ws://') +
      location.host + '/ws'
    );

    ws.onopen = () => sendAction(action);

    ws.onmessage = event => {
      let data;
      try { data = JSON.parse(event.data); } catch { return; }

      if (data.type === 'room' || data.type === 'joined') {
        myId = data.id;
        status.textContent = 'Room Code: ' + data.code;
      } else if (data.type === 'snapshot') {
        players = data.players || {};
        if (data.code) {
          status.textContent =
            'Room: ' + data.code + ' | खिलाड़ी: ' + data.count;
        }
      } else if (data.type === 'error') {
        status.textContent = data.message;
      }
    };

    ws.onerror = () => {
      status.textContent = 'कनेक्शन में समस्या। दोबारा कोशिश करो।';
    };

    ws.onclose = () => {
      status.textContent = 'सर्वर से कनेक्शन बंद हो गया।';
    };
  }

  function sendAction(action) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    const playerName = name.value.trim() || 'Player';
    ws.send(JSON.stringify({
      type: action,
      name: playerName,
      code: document.getElementById('mpCode').value.trim().toUpperCase()
    }));
  }

  document.getElementById('mpCreate').onclick = () => connect('create');
  document.getElementById('mpJoin').onclick = () => {
    if (!document.getElementById('mpCode').value.trim()) {
      status.textContent = 'पहले Room Code डालो।';
      return;
    }
    connect('join');
  };

  setInterval(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN || !myId) return;

    const gameCanvas = document.getElementById('game');
    const gameWidth = gameCanvas.width;
    const gameHeight = gameCanvas.height;

    ws.send(JSON.stringify({
      type: 'state',
      name: name.value.trim() || 'Player',
      x: px / gameWidth,
      z: py / gameHeight,
      yaw: 0,
      hp: hp
    }));
  }, 100);

  function drawPlayers() {
    if (overlay.width !== innerWidth || overlay.height !== innerHeight) {
      overlay.width = innerWidth;
      overlay.height = innerHeight;
    }

    ctx.clearRect(0, 0, overlay.width, overlay.height);

    for (const id in players) {
      if (id === myId) continue;
      const p = players[id];
      if (!p || !p.state) continue;

      const x = p.state.x * overlay.width;
      const y = p.state.z * overlay.height;

      ctx.fillStyle = '#ff8c42';
      ctx.beginPath();
      ctx.arc(x, y, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'white';
      ctx.font = '14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(p.state.name || 'Player', x, y - 22);
    }

    requestAnimationFrame(drawPlayers);
  }

  drawPlayers();
})();
</script>
</body>
</html>

</body>
