
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Atul Battle Royale</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#c9ad75;color:white;font-family:Arial;overflow:hidden;touch-action:none}
#game{width:100vw;height:100dvh;display:block}
#info{position:fixed;top:8px;left:8px;background:#17150ddd;padding:9px;border-radius:9px;z-index:3;font-size:12px;line-height:1.6}
#mp{position:fixed;right:8px;top:8px;width:145px;background:#17150dee;padding:8px;border-radius:9px;z-index:5;font-size:12px}
#mp input,#mp button{width:100%;padding:8px;margin-top:5px;border:0;border-radius:6px}
#mp button{background:#3c6040;color:white;font-weight:bold}
#mini{position:fixed;right:8px;bottom:190px;width:85px;height:85px;background:#333;z-index:3;border:2px solid white;border-radius:7px}
#moveStick,#aimStick{position:fixed;bottom:25px;width:120px;height:120px;border:3px solid #ffffff88;border-radius:50%;background:#0005;z-index:8;touch-action:none}
#moveStick{left:18px}
#aimStick{right:100px}
.knob{position:absolute;left:35px;top:35px;width:44px;height:44px;border-radius:50%;background:#ffffffbb;border:2px solid white;pointer-events:none}
#fire2{position:fixed;right:12px;bottom:45px;width:76px;height:76px;border-radius:50%;border:3px solid white;background:#c32e22;color:white;font-weight:bold;z-index:9;touch-action:none}
#hint{position:fixed;bottom:155px;left:12px;font-size:10px;color:white;text-shadow:0 1px 3px black;z-index:4}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="info">
<b>ATUL BATTLE ROYALE</b><br>
❤️ Health: <span id="hp">100</span><br>
🎯 Kills: <span id="score">0</span><br>
🔵 Zone: <span id="zone">100%</span><br>
👥 Players: <span id="count">1</span>
</div>

<div id="mp">
<b>🌐 ONLINE ROOM</b>
<input id="playerName" maxlength="16" value="Player" placeholder="Player name">
<button id="create">Create Room</button>
<input id="roomCode" maxlength="5" placeholder="Room Code">
<button id="join">Join Room</button>
<div id="status" style="margin-top:6px;overflow-wrap:anywhere">Ready</div>
</div>

<canvas id="mini" width="85" height="85"></canvas>
<div id="hint">बायाँ: चलें · दायाँ: Aim · FIRE: गोली</div>

<div id="moveStick"><div id="moveKnob" class="knob"></div></div>
<div id="aimStick"><div id="aimKnob" class="knob"></div></div>
<button id="fire2">FIRE</button>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const mini=document.getElementById('mini');
const mctx=mini.getContext('2d');

const WORLD=4000;
const CENTER=WORLD/2;
const START_RADIUS=1750;
const END_RADIUS=170;
const SHRINK_TIME=180000;

let w=innerWidth,h=innerHeight;
let px=CENTER,py=CENTER;
let hp=100,kills=0;
let aimAngle=-Math.PI/2;
let moveX=0,moveY=0;
let last=performance.now(),lastDamage=0;
let shots=[],enemies=[];
let ws=null,myId=null,players={};
let roomJoined=false;

function resize(){
 w=innerWidth;h=innerHeight;
 canvas.width=w;canvas.height=h;
}
resize();
addEventListener('resize',resize);

function rand(a,b){return a+Math.random()*(b-a)}

const buildings=[];
for(let i=0;i<42;i++){
 buildings.push({
  x:rand(100,WORLD-250),
  y:rand(100,WORLD-250),
  w:rand(65,145),
  h:rand(55,115)
 });
}

function spawnEnemy(){
 enemies.push({x:rand(100,WORLD-100),y:rand(100,WORLD-100),r:14});
}
for(let i=0;i<14;i++)spawnEnemy();

function zoneRadius(){
 const progress=Math.min(1,Math.max(0,(Date.now()-zoneStart)/SHRINK_TIME));
 return START_RADIUS-(START_RADIUS-END_RADIUS)*progress;
}
let zoneStart=Date.now();

function setupStick(id,knobId,onMove,onEnd){
 const pad=document.getElementById(id);
 const knob=document.getElementById(knobId);
 let pointer=null;

 function update(e){
  const r=pad.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const max=37;
  const d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max;dy=dy/d*max}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  onMove(dx/max,dy/max,e.clientX,e.clientY);
 }

 pad.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(pointer!==null)return;
  pointer=e.pointerId;
  pad.setPointerCapture(pointer);
  update(e);
 });

 pad.addEventListener('pointermove',e=>{
  if(e.pointerId===pointer)update(e);
 });

 function end(e){
  if(e.pointerId!==pointer)return;
  pointer=null;
  knob.style.transform='translate(0px,0px)';
  onEnd();
 }
 pad.addEventListener('pointerup',end);
 pad.addEventListener('pointercancel',end);
}

setupStick('moveStick','moveKnob',(x,y)=>{
 moveX=x;moveY=y;
},()=>{
 moveX=0;moveY=0;
});

setupStick('aimStick','aimKnob',(x,y,screenX,screenY)=>{
 if(Math.hypot(x,y)>.15){
  aimAngle=Math.atan2(y,x);
 }
},()=>{});

function fire(){
 if(hp<=0)return;
 const speed=13;
 shots.push({
  x:px+Math.cos(aimAngle)*22,
  y:py+Math.sin(aimAngle)*22,
  vx:Math.cos(aimAngle)*speed,
  vy:Math.sin(aimAngle)*speed,
  life:100
 });
}
document.getElementById('fire2').addEventListener('pointerdown',e=>{
 e.preventDefault();
 fire();
});

function drawMap(){
 ctx.fillStyle='#c9ad75';
 ctx.fillRect(0,0,WORLD,WORLD);

 // रेत के छोटे निशान
 for(let i=0;i<260;i++){
  const x=(i*7919)%WORLD,y=(i*104729)%WORLD;
  ctx.fillStyle=i%2?'#b99b65':'#d9c18a';
  ctx.fillRect(x,y,4,3);
 }

 // सड़कें
 const roads=[
  {x:0,y:850,w:WORLD,h:90},
  {x:0,y:2800,w:WORLD,h:100},
  {x:1000,y:0,w:85,h:WORLD},
  {x:2950,y:0,w:100,h:WORLD}
 ];
 roads.forEach(r=>{
  ctx.fillStyle='#84785f';ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.strokeStyle='#e4d2a3';ctx.lineWidth=3;ctx.setLineDash([20,20]);
  ctx.beginPath();
  if(r.w>r.h){
   ctx.moveTo(r.x,r.y+r.h/2);ctx.lineTo(r.x+r.w,r.y+r.h/2);
  }else{
   ctx.moveTo(r.x+r.w/2,r.y);ctx.lineTo(r.x+r.w/2,r.y+r.h);
  }
  ctx.stroke();ctx.setLineDash([]);
 });

 // मिलिट्री बेस
 ctx.fillStyle='#686b54';
 ctx.fillRect(1500,1400,1000,950);
 ctx.strokeStyle='#ddd0a8';ctx.lineWidth=9;
 ctx.strokeRect(1500,1400,1000,950);

 buildings.forEach((b,i)=>{
  ctx.fillStyle='#5c5140';
  ctx.fillRect(b.x+5,b.y+6,b.w,b.h);
  ctx.fillStyle=i%3===0?'#7c806e':'#a59b7d';
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='#4b5947';
  ctx.fillRect(b.x+8,b.y+8,b.w-16,10);
  ctx.strokeStyle='#e0d0aa';ctx.lineWidth=2;
  ctx.strokeRect(b.x,b.y,b.w,b.h);
 });

 // बेस के कंटेनर
 for(let i=0;i<9;i++){
  const x=1620+(i%3)*245,y=1540+Math.floor(i/3)*220;
  ctx.fillStyle=i%2?'#596b4c':'#87583e';
  ctx.fillRect(x,y,140,70);
  ctx.strokeStyle='#e0d0aa';ctx.lineWidth=2;
  ctx.strokeRect(x,y,140,70);
  for(let k=1;k<5;k++){
   ctx.beginPath();ctx.moveTo(x+k*25,y);ctx.lineTo(x+k*25,y+70);ctx.stroke();
  }
 }
}

function drawZone(){
 const r=zoneRadius();
 ctx.save();
 ctx.fillStyle='rgba(180,30,20,.28)';
 ctx.beginPath();
 ctx.rect(0,0,WORLD,WORLD);
 ctx.arc(CENTER,CENTER,r,0,Math.PI*2,true);
 ctx.fill('evenodd');

 ctx.strokeStyle='#54cfff';ctx.lineWidth=12;
 ctx.beginPath();ctx.arc(CENTER,CENTER,r,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='#dff8ff';ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(CENTER,CENTER,r,0,Math.PI*2);ctx.stroke();
 ctx.restore();

 document.getElementById('zone').textContent=
  Math.round(r/START_RADIUS*100)+'%';
}

function drawPlayer(x,y,color,label,angle){
 ctx.fillStyle=color;
 ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();

 // खिलाड़ी की दिशा का निशान
 ctx.strokeStyle='#fff';ctx.lineWidth=5;
 ctx.beginPath();
 ctx.moveTo(x,y);
 ctx.lineTo(x+Math.cos(angle)*24,y+Math.sin(angle)*24);
 ctx.stroke();

 ctx.fillStyle='white';
 ctx.font='14px Arial';
 ctx.textAlign='center';
 ctx.fillText(label||'Player',x,y-25);
}

function drawMini(){
 mctx.fillStyle='#c9ad75';
 mctx.fillRect(0,0,85,85);
 mctx.strokeStyle='#54cfff';mctx.lineWidth=1.5;
 mctx.beginPath();
 mctx.arc(42.5,42.5,zoneRadius()/WORLD*85,0,Math.PI*2);
 mctx.stroke();

 mctx.fillStyle='#28a9ff';
 mctx.fillRect(px/WORLD*85-2,py/WORLD*85-2,5,5);

 for(const id in players){
  if(id===myId)continue;
  const p=players[id];
  if(!p)continue;
  mctx.fillStyle='#ff5544';
  mctx.fillRect(p.x*85-2,p.z*85-2,4,4);
 }
}

function loop(t){
 const dt=Math.min((t-last)/16||1,2);
 last=t;

 if(hp>0){
  const speed=4.2;
  px+=moveX*speed*dt;
  py+=moveY*speed*dt;
 }
 px=Math.max(20,Math.min(WORLD-20,px));
 py=Math.max(20,Math.min(WORLD-20,py));

 const camX=Math.max(0,Math.min(WORLD-w,px-w/2));
 const camY=Math.max(0,Math.min(WORLD-h,py-h/2));

 ctx.clearRect(0,0,w,h);
 ctx.save();
 ctx.translate(-camX,-camY);

 drawMap();
 drawZone();

 // गोलियाँ
 shots.forEach(s=>{
  s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
 });
 shots=shots.filter(s=>s.life>0&&s.x>=0&&s.y>=0&&s.x<=WORLD&&s.y<=WORLD);

 ctx.fillStyle='#ffe36c';
 shots.forEach(s=>{
  ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fill();
 });

 // दुश्मन
 enemies.forEach(e=>{
  const dx=px-e.x,dy=py-e.y,d=Math.hypot(dx,dy)||1;
  e.x+=dx/d*.35*dt;e.y+=dy/d*.35*dt;
  ctx.fillStyle='#ba3d2d';
  ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
  if(d<30&&t-lastDamage>600){
   hp=Math.max(0,hp-1);lastDamage=t;
  }
 });

 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];
  const hit=shots.some(s=>Math.hypot(s.x-e.x,s.y-e.y)<e.r+7);
  if(hit){
   enemies.splice(i,1);
   shots=shots.filter(s=>Math.hypot(s.x-e.x,s.y-e.y)>=e.r+7);
   kills++;spawnEnemy();
  }
 }

 // Safe Zone damage
 if(Math.hypot(px-CENTER,py-CENTER)>zoneRadius()&&t-lastDamage>900){
  hp=Math.max(0,hp-2);lastDamage=t;
 }

 drawPlayer(px,py,'#28a9ff','YOU',aimAngle);

 for(const id in players){
  if(id===myId)continue;
  const p=players[id];
  if(!p)continue;
  drawPlayer(p.x*WORLD,p.z*WORLD,'#ff5544',p.name,p.yaw||0);
 }

 ctx.restore();

 document.getElementById('hp').textContent=hp;
 document.getElementById('score').textContent=kills;
 document.getElementById('count').textContent=Object.keys(players).length||1;
 drawMini();

 if(hp>0)requestAnimationFrame(loop);
 else{
  ctx.fillStyle='#17130ddd';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='white';ctx.textAlign='center';
  ctx.font='bold 30px Arial';ctx.fillText('GAME OVER',w/2,h/2);
  ctx.font='16px Arial';ctx.fillText('Refresh to play again',w/2,h/2+32);
 }
}
requestAnimationFrame(loop);

// ऑनलाइन रूम
const status=document.getElementById('status');
const nameInput=document.getElementById('playerName');
const codeInput=document.getElementById('roomCode');

function connect(action){
 if(ws&&ws.readyState===WebSocket.OPEN){
  sendAction(action);return;
 }
 status.textContent='Connecting...';
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');

 ws.onopen=()=>sendAction(action);
 ws.onmessage=e=>{
  let d;try{d=JSON.parse(e.data)}catch{return}
  if(d.type==='room'||d.type==='joined'){
   myId=d.id;roomJoined=true;
   status.textContent='Room Code: '+d.code;
  }else if(d.type==='snapshot'){
   players=d.players||{};
   document.getElementById('count').textContent=d.count||1;
   if(d.code)status.textContent='Room: '+d.code+' | Players: '+d.count;
  }else if(d.type==='error'){
   status.textContent=d.message;
  }else if(d.type==='tagged'){
   hp=Math.max(0,hp-10);
  }
 };
 ws.onerror=()=>status.textContent='Connection error';
 ws.onclose=()=>status.textContent='Disconnected';
}

function sendAction(type){
 if(!ws||ws.readyState!==WebSocket.OPEN)return;
 ws.send(JSON.stringify({
  type,
  name:nameInput.value.trim()||'Player',
  code:codeInput.value.trim().toUpperCase()
 }));
}

document.getElementById('create').onclick=()=>connect('create');
document.getElementById('join').onclick=()=>{
 if(!codeInput.value.trim()){
  status.textContent='पहले Room Code डालो';return;
 }
 connect('join');
};

// सर्वर पर खिलाड़ी की स्थिति भेजें
setInterval(()=>{
 if(!ws||ws.readyState!==WebSocket.OPEN||!myId)return;
 ws.send(JSON.stringify({
  type:'state',
  name:nameInput.value.trim()||'Player',
  x:px/WORLD,
  z:py/WORLD,
  yaw:aimAngle,
  hp
 }));
},100);
</script>
</body>
</html>
